[[case]]
id = "dev-min"
kind = "min"
category = "AI coding"
group = "dev"
recommended_mode = "dense"
input = '''
MidFDでBreadcrumb root表示を修正してください。対象repoはG:\source\repos\MidFDです。Controls/BreadcrumbPathControl.csと関連testだけを調査し、Path.GetFullPathの挙動は変えないでください。検証はdotnet test .\tests\MidFD.Tests\MidFD.Tests.csproj --filter FullyQualifiedName~PathModelTestsを実行してください。stage、commit、pushは禁止です。buildやtest成功をRT:v扱いしないでください。
'''
output = '''
KDSL_PROMPT:
format: KDSL
profile: dev-prompt
mode: min
safety: normal
agent: required

局面: MidFD Breadcrumb root表示補正
目的: root表示修正
成功条件: root表示補正／既存navigation・UNC・drive判定維持
正本: G:\source\repos\MidFD
対象: Controls/BreadcrumbPathControl.cs／関連test
非対象: Path.GetFullPath挙動変更
作業: 現実装・test確認→原因限定→必要箇所修正
試験: dotnet test .\tests\MidFD.Tests\MidFD.Tests.csproj --filter FullyQualifiedName~PathModelTests
検証: build／test pass != RT:v
権限: 読取／編集／試験=可、stage／commit／push=禁止
停止条件: 対象外仕様変更必要／baseline不一致
'''
required = ["KDSL_PROMPT:", "profile: dev-prompt", "mode: min", "stage／commit／push=禁止", "build／test pass != RT:v"]
forbidden = ["Path.GetFullPath変更", "RT:v済", "承認待"]
identifiers = ['G:\source\repos\MidFD', "Controls/BreadcrumbPathControl.cs", "Path.GetFullPath", 'dotnet test .\tests\MidFD.Tests\MidFD.Tests.csproj --filter FullyQualifiedName~PathModelTests']
prefix = "KDSL_PROMPT:"

